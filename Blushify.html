<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styleB.css">
    <title>Brushify</title>
</head>
<body>
    <center>
        <h1>Brushify</h1>
        <br><br><br><br>
        <div id="editor" contenteditable="true"></div>
        <br><br><br>
        <div id="parent">
            <div id="child">
                <h1>Backgroundcolor</h1>
                <br><br>
                <button class="bg" onclick="bgc('salmon')"  style="background-color:salmon;"></button>
                <button class="bg" onclick="bgc('palevioletred')" style="background-color:palevioletred ;" ></button>
                 <button class="bg" onclick="bgc('grey')" style="background-color:grey;" ></button>
                 <button class="bg" onclick="bgc('hotpink')" style="background-color:hotpink;" ></button>
                 <button class="bg" onclick="bgc('peru')" style="background-color: peru;" ></button>
             </div>
              <div id="child">
                <h1>Textcolor</h1>
                <br><br>
                <button class="bg" onclick="Textcolor('chartreuse')" style="background-color: chartreuse; "></button>
                <button class="bg" onclick="Textcolor('khaki')" style="background-color:khaki; border: 1px solid black;"></button>
                <button class="bg" onclick="Textcolor('navy')" style="background-color: navy;"></button>
                <button class="bg" onclick="Textcolor('fuchsia')" style="background-color: fuchsia;"></button>
                <button class="bg" onclick="Textcolor('skyblue')" style="background-color: skyblue;"></button>
            </div>
              <div id="child">
                <h1>FontStyle</h1>
                <br><br>
                <button class="fnt" onclick="font('sans-serif')" >Hola</button>
                <button class="fnt" onclick="font('serif')"      >Hola</button>
                <button class="fnt" onclick="font('monospace')"  >Hola</button>
                <button class="fnt" onclick="font('cursive')"    >Hola</button>
                <button class="fnt" onclick="font('fantasy')">Hola</button>
            </div>
        </div>
    </center>

    <script>
        function bgc(color){
            document.getElementById('editor').style.backgroundColor = color
        }
         function Textcolor(color){
            document.getElementById('editor').style.color = color
        }
         function font(font){
            document.getElementById('editor').style.fontFamily = font
        }
    </script>
    
</body>
</html>
